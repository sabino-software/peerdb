name: Update RDS Certificate Bundle shasum

on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:
    inputs: {}

permissions:
  pull-requests: write
  contents: write

concurrency:
  group: aws-rds-bundle-shasum-update
  cancel-in-progress: false

env:
  GH_REPO: ${{ github.repository }}
  PR_BASE: ${{ github.event.repository.default_branch }}
  PR_BRANCH: automated/aws-rds-bundle-shasum-update
  PR_LABEL: dependencies
  PR_TITLE: "feat: update `aws-rds-bundle-shasum` in Dockerfile"

jobs:
  update-rds-bundle-shasum:
    # Keep this fork's daily PR-only updates; other forks must opt in manually.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      !github.event.repository.fork ||
      github.repository == 'sabino-software/peerdb'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.PR_BASE }}
      - name: create-PR-if-needed
        shell: bash
        run: |
          set -euo pipefail
          latest_sha="$(curl -fsS --retry 3 --max-time 120 "https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem" | sha256sum | cut -d' ' -f1)"
          sed -i -E 's|(ADD --checksum=sha256:)(\w+)( https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem /usr/local/share/ca-certificates/global-aws-rds-bundle.pem)|\1'"${latest_sha}"'\3|g' stacks/flow.Dockerfile
          git diff --quiet -- stacks/flow.Dockerfile && exit 0

          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git checkout -b "${PR_BRANCH}"
          git add stacks/flow.Dockerfile

          git commit -m 'chore(automated): update AWS RDS certificate bundle checksum'
          # An explicit lease also works with checkout's shallow default-branch fetch.
          remote_sha="$(git ls-remote --heads origin "refs/heads/${PR_BRANCH}" | cut -f1)"
          git push --force-with-lease="refs/heads/${PR_BRANCH}:${remote_sha}" origin "HEAD:refs/heads/${PR_BRANCH}"

          PR_URL=$(gh pr list --repo "$GH_REPO" --state open --base "$PR_BASE" --head "$PR_BRANCH" --json url --jq '.[0].url // empty')
          if [ -z "$PR_URL" ]; then
            PR_URL=$(gh pr create --repo "$GH_REPO" --base "$PR_BASE" --head "$PR_BRANCH" --title "$PR_TITLE" --body "Update the AWS RDS certificate bundle checksum. Please review before merging.")
          fi

          # Labels are optional metadata and may be absent on forks.
          if ! gh pr edit "$PR_URL" --repo "$GH_REPO" --add-label "$PR_LABEL"; then
            echo "::warning::Could not add optional label '${PR_LABEL}' to ${PR_URL}."
          fi
        env:
          GH_TOKEN: ${{ github.token }}
